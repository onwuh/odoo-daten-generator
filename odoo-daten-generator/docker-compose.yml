# Local-first and deployment-target-agnostic: the same compose file runs on the
# operator's Mac and on the Raspberry Pi 5. Only .env differs between them.
services:
  generator:
    build: .
    image: odoo-demodaten-generator:latest
    restart: unless-stopped
    env_file: .env
    environment:
      # Container-only paths, set here rather than in .env: /data is the mounted
      # volume and exists only inside the container. Keeping them out of .env is
      # what stops a local `uvicorn web.app:app` run from inheriting them.
      ODOO_GENERATOR_CACHE_DIR: /data/seeds/cache
      ODOO_GENERATOR_RUNS_DIR: /data/seeds/runs
    # Local default binds to loopback only, so a laptop instance is not on the
    # network at all. The server profile sets ODOO_GENERATOR_BIND=0.0.0.0 and
    # puts a TLS-terminating reverse proxy in front.
    ports:
      - "${ODOO_GENERATOR_BIND:-127.0.0.1}:${ODOO_GENERATOR_PORT:-8000}:8000"
    volumes:
      # The only writable path. Holds the LLM seed cache and the D7 run journals.
      - generator-data:/data
    tmpfs:
      - /tmp:size=64m,mode=1777
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # A runaway run must not starve the operator's other private services on the
    # same box. Work is I/O-bound, so these are generous for the expected load.
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1g
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Optional public HTTPS entry point for a colleague test. Behind a compose
  # profile so `docker compose up` never exposes anything by accident:
  #
  #     docker compose --profile tunnel up -d
  #     docker compose logs tunnel | grep trycloudflare
  #
  # The quick tunnel needs no Cloudflare account. It prints a random
  # https://<random>.trycloudflare.com address that changes on every restart —
  # unguessable, but public: the shared access code is the only thing in front
  # of it, so use a real one.
  #
  # The generator serves plain http inside the compose network; cloudflared
  # terminates TLS at the edge. The app's CMD already passes --proxy-headers, so
  # request.url.scheme reads "https" and the session cookie gets its Secure flag
  # without any further configuration.
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    depends_on:
      - generator
    command: tunnel --no-autoupdate --url http://generator:8000
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  generator-data:
