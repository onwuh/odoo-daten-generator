name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Offline unit suite only (tests/unit/, mocked Odoo). The live integration
  # suite (tests/integration/test_suite.py) needs a real Odoo instance + LLM
  # API keys and writes/deletes real records at ~1 req/s — it stays a manual,
  # local-only run (see CLAUDE.md "Testing"), never a CI gate on PRs/forks.
  unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: odoo-daten-generator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: odoo-daten-generator/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python tests/unit/unit_suite.py

  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: odoo-daten-generator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: odoo-daten-generator/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker://ghcr.io/gitleaks/gitleaks:latest
        with:
          args: detect --source . --redact -v --exit-code 1
